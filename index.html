
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Flower</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: black;
    }

    body {
        font-family: Arial, sans-serif;
        color: white;
    }

    /* Welcome screen */
    #welcome {
        position: fixed;
        inset: 0;
        background-color: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
        z-index: 10;
    }

    h1 {
        color: white;
        text-align: center;
        margin: 0;
        font-size: 36px;
    }

    button {
        background-color: white;
        color: black;
        border: none;
        padding: 15px 35px;
        border-radius: 25px;
        font-size: 18px;
        cursor: pointer;
    }

    /* Flower animation screen */
    #flowerScreen {
        display: none;
        width: 100%;
        min-height: 100vh;
        background-color: black;
        justify-content: center;
        align-items: center;
    }

    canvas {
        display: block;
        width: 100%;
        max-width: 600px;
        height: min(80vh, 600px);
    }
</style>
</head>

<body>

<!-- Welcome screen -->
<div id="welcome">
    <h1>My Flower 🌸</h1>
    <button onclick="startFlower()">Start Flower</button>
</div>

<!-- Flower animation -->
<div id="flowerScreen">
    <canvas id="flower"></canvas>
</div>

<audio id="music" src="music.mp3"></audio>

<script>
const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");

let strokes = [];
let x = 0;
let y = 0;
let angle = 0;
let penDown = true;
let penColor = "red";

let currentStroke = {
    color: penColor,
    points: [{x, y}]
};

function addPoint(px, py) {
    if (penDown) {
        currentStroke.points.push({x: px, y: py});
    }
}

function forward(distance) {
    x += Math.cos(angle * Math.PI / 180) * distance;
    y += Math.sin(angle * Math.PI / 180) * distance;
    addPoint(x, y);
}

function left(degrees) {
    angle -= degrees;
}

function right(degrees) {
    angle += degrees;
}

function circle(radius, extent) {
    const steps = 30;

    const cx = x + Math.sin(angle * Math.PI / 180) * radius;
    const cy = y - Math.cos(angle * Math.PI / 180) * radius;

    const start = Math.atan2(y - cy, x - cx);

    for (let i = 1; i <= steps; i++) {
        const a = start - (extent * Math.PI / 180) * i / steps;

        x = cx + radius * Math.cos(a);
        y = cy + radius * Math.sin(a);

        addPoint(x, y);
    }

    angle -= extent;
}

function penup() {
    penDown = false;
}

function pendown() {
    penDown = true;
    currentStroke = {
        color: penColor,
        points: [{x, y}]
    };
    strokes.push(currentStroke);
}

function setColor(color) {
    penColor = color;

    if (penDown) {
        currentStroke = {
            color: penColor,
            points: [{x, y}]
        };
        strokes.push(currentStroke);
    }
}

// Draw flower
strokes.push(currentStroke);

for (let i = 0; i < 36; i++) {
    circle(100, 90);
    left(90);
    circle(100, 90);
    left(10);
}

// Draw stem
penup();
right(90);
forward(100);
pendown();
setColor("green");
forward(200);

// Move halfway up stem
penup();
forward(-100);
pendown();

// Draw leaf
right(90);
circle(40, 90);
left(90);
circle(40, 90);

// Calculate drawing points
const allPoints = strokes.reduce(
    (total, stroke) => total + stroke.points.length,
    0
);

const points = strokes.flatMap(stroke => stroke.points);

const minX = Math.min(...points.map(p => p.x));
const maxX = Math.max(...points.map(p => p.x));
const minY = Math.min(...points.map(p => p.y));
const maxY = Math.max(...points.map(p => p.y));

function draw(progress) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    const scale = Math.min(
        (w - 40) / (maxX - minX),
        (h - 40) / (maxY - minY)
    );

    ctx.setTransform(
        dpr * scale, 0,
        0, dpr * scale,
        dpr * (w - (maxX - minX) * scale) / 2 - dpr * minX * scale,
        dpr * (h - (maxY - minY) * scale) / 2 - dpr * minY * scale
    );

    let remaining = Math.floor(progress * allPoints);

    for (const stroke of strokes) {
        const pts = stroke.points;
        const count = Math.min(remaining, pts.length);

        remaining -= count;

        if (count < 2) continue;

        ctx.beginPath();
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = 3 / scale;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.moveTo(pts[0].x, pts[0].y);

        for (let i = 1; i < count; i++) {
            ctx.lineTo(pts[i].x, pts[i].y);
        }

        ctx.stroke();
    }
}

let startTime = null;

function animate(timestamp) {
    if (startTime === null) {
        startTime = timestamp;
    }

    const progress = Math.min(
        (timestamp - startTime) / 30000,
        1
    );

    draw(progress);

    if (progress < 1) {
        requestAnimationFrame(animate);
    }
}

function startFlower() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("flowerScreen").style.display = "flex";

    const music = document.getElementById("music");
    music.currentTime = 0;
    music.play().catch(error => {
        console.log("Music could not play:", error);
    });

    startTime = null;
    requestAnimationFrame(animate);
}
</script>

</body>
</html>
